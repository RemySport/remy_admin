name: Deploy to S3 + CloudFront

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE: ${{ vars.NEXT_PUBLIC_API_BASE }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2

      # 해시가 붙은 정적 자산을 먼저 올린다. 새 HTML이 참조하는 청크가
      # 미리 존재해야 배포 도중 404가 나지 않는다.
      - name: Upload hashed assets
        run: |
          aws s3 sync out/ s3://${{ vars.S3_BUCKET }}/ \
            --exclude "*" --include "_next/static/*" \
            --cache-control "public,max-age=31536000,immutable"

      # HTML과 RSC 페이로드(__next.*.txt)는 매번 재검증해야 한다.
      # _next/static 은 --delete 대상에서 빼서 배포 중인 세션이 구 청크를 잃지 않게 한다.
      - name: Upload HTML and the rest
        run: |
          aws s3 sync out/ s3://${{ vars.S3_BUCKET }}/ --delete \
            --exclude "_next/static/*" \
            --exclude ".next/*" \
            --cache-control "public,max-age=0,must-revalidate"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
